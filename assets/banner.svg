<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-30px, 20px); opacity: 0.55; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .orb-1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 9s ease-in-out infinite; transform-origin: 1000px 300px; }
    .float-1 { animation: floatPill1 4s ease-in-out infinite; }
    .float-2 { animation: floatPill2 4.5s ease-in-out infinite 0.5s; }
    .float-3 { animation: floatPill1 5s ease-in-out infinite 1s; }
    .float-4 { animation: floatPill2 4.2s ease-in-out infinite 1.5s; }
    .stream-line { stroke-dasharray: 6 6; animation: dashCycle 2.5s linear infinite; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Ambience in Background -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="220" cy="90" r="140" fill="#06b6d4" />
    <circle class="orb-2" cx="980" cy="330" r="160" fill="#8b5cf6" />
    <circle cx="600" cy="210" r="100" fill="#3b82f6" opacity="0.2" />
  </g>

  <!-- Animated Data Flow Lines in Background -->
  <g opacity="0.4">
    <path class="stream-line" d="M 50,330 C 250,290 400,370 600,330 C 800,290 950,380 1150,320" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50,90 C 300,140 500,40 700,90 C 900,140 1050,60 1150,90" fill="none" stroke="#a855f7" stroke-width="1.8" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Pill -->
  <g class="float-1" transform="translate(470, 48)">
    <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="35" y="22" fill="#94a3b8" class="text-body" font-size="13" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 145)">
    <text text-anchor="middle" class="text-title" font-size="46" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Document &amp; File Previewer
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 192)">
    <text text-anchor="middle" class="text-body" font-size="18" fill="#94a3b8" font-weight="400">
      Universal Browser-Based Rendering • Open-Source Engines • Turnkey SaaS SDKs
    </text>
  </g>

  <!-- Dynamic Feature Badges / Floating Pills Row -->
  <!-- Pill 1: PDF Engines -->
  <g class="float-2" transform="translate(130, 260)" filter="url(#cardShadow)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#ef4444" fill-opacity="0.15" />
    <text x="32" y="38" text-anchor="middle" font-size="20">📄</text>
    <text x="60" y="34" fill="#f8fafc" class="text-body" font-size="15" font-weight="700">PDF &amp; Vectors</text>
    <text x="60" y="50" fill="#64748b" class="text-body" font-size="12">PDF.js, MuPDF, PDFBox</text>
  </g>

  <!-- Pill 2: Office Docs -->
  <g class="float-3" transform="translate(370, 260)" filter="url(#cardShadow)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#3b82f6" fill-opacity="0.15" />
    <text x="32" y="38" text-anchor="middle" font-size="20">📊</text>
    <text x="60" y="34" fill="#f8fafc" class="text-body" font-size="15" font-weight="700">Office Suite</text>
    <text x="60" y="50" fill="#64748b" class="text-body" font-size="12">DOCX, XLSX, PPTX, OFD</text>
  </g>

  <!-- Pill 3: Media & Images -->
  <g class="float-4" transform="translate(610, 260)" filter="url(#cardShadow)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.15" />
    <text x="32" y="38" text-anchor="middle" font-size="20">🖼️</text>
    <text x="60" y="34" fill="#f8fafc" class="text-body" font-size="15" font-weight="700">Media &amp; Images</text>
    <text x="60" y="50" fill="#64748b" class="text-body" font-size="12">Viewer.js, Audio/Video, 3D</text>
  </g>

  <!-- Pill 4: Cloud & Enterprise SDKs -->
  <g class="float-1" transform="translate(850, 260)" filter="url(#cardShadow)">
    <rect width="220" height="64" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.15" />
    <text x="32" y="38" text-anchor="middle" font-size="20">⚡</text>
    <text x="60" y="34" fill="#f8fafc" class="text-body" font-size="15" font-weight="700">Enterprise SDKs</text>
    <text x="60" y="50" fill="#64748b" class="text-body" font-size="12">Nutrient, Foxit, Box, WASM</text>
  </g>

  <!-- Footer Tagline -->
  <g transform="translate(600, 375)">
    <text text-anchor="middle" class="text-body" font-size="13" fill="#64748b" font-weight="500" letter-spacing="0.5">
      Client-Side Zero-Upload Rendering &bull; Multi-Format Conversion &bull; Self-Hosted Sovereignty
    </text>
  </g>
</svg>
