<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <!-- Clean, Robust SVG Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13px;
      fill: #38bdf8;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .pill-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .pill-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      fill: #64748b;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="160" cy="80" r="130" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />
  <circle cx="1060" cy="220" r="150" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />

  <!-- Dynamic Wave Path with SMIL Animation -->
  <path fill="none" stroke="url(#textGrad)" stroke-width="2.5" opacity="0.45">
    <animate attributeName="d" 
             dur="6s" 
             repeatCount="indefinite" 
             values="M 50 280 Q 320 250 600 280 T 1150 280;
                     M 50 280 Q 320 305 600 280 T 1150 280;
                     M 50 280 Q 320 250 600 280 T 1150 280" />
  </path>
  
  <circle cx="600" cy="280" r="4.5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" values="50;1150;50" />
  </circle>

  <!-- Graphic Preview Art on the Right Side -->
  <g transform="translate(1015, 120)">
    <circle r="75" fill="url(#cyanGrad)" opacity="0.12" filter="url(#glow)" />
    <circle r="55" stroke="url(#textGrad)" stroke-width="2" fill="#0f172a" fill-opacity="0.8" />
    <!-- Document Stack Icon -->
    <rect x="-24" y="-30" width="40" height="52" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="-18" y="-24" width="42" height="54" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <line x1="-10" y1="-12" x2="14" y2="-12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-10" y1="-2" x2="14" y2="-2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-10" y1="8" x2="6" y2="8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <circle cx="12" cy="18" r="7" fill="#10b981" />
    <polyline points="9,18 11,20 15,16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Content Container -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="245" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" class="tag">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="108" class="title">Awesome Document &amp; File Previewer</text>

    <!-- Subtitle -->
    <text x="0" y="142" class="subtitle">Universal Browser-Based Rendering • Open-Source Engines • Turnkey SaaS SDKs</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: PDF -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="52" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#ef4444" fill-opacity="0.15" />
        <text x="26" y="32" font-size="16" text-anchor="middle">📄</text>
        <text x="50" y="26" class="pill-title">PDF &amp; Vectors</text>
        <text x="50" y="41" class="pill-sub">PDF.js, Stirling, MuPDF</text>
      </g>

      <!-- Pill 2: Office -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="195" height="52" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#3b82f6" fill-opacity="0.15" />
        <text x="26" y="32" font-size="16" text-anchor="middle">📊</text>
        <text x="50" y="26" class="pill-title">Office Suite</text>
        <text x="50" y="41" class="pill-sub">DOCX, XLSX, PPTX, OFD</text>
      </g>

      <!-- Pill 3: Media -->
      <g transform="translate(420, 0)">
        <rect x="0" y="0" width="200" height="52" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#10b981" fill-opacity="0.15" />
        <text x="26" y="32" font-size="16" text-anchor="middle">🖼️</text>
        <text x="50" y="26" class="pill-title">Media &amp; Universal</text>
        <text x="50" y="41" class="pill-sub">kkFileView, Viewer.js, 3D</text>
      </g>

      <!-- Pill 4: Enterprise -->
      <g transform="translate(635, 0)">
        <rect x="0" y="0" width="205" height="52" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#8b5cf6" fill-opacity="0.15" />
        <text x="26" y="32" font-size="16" text-anchor="middle">⚡</text>
        <text x="50" y="26" class="pill-title">Enterprise SDKs</text>
        <text x="50" y="41" class="pill-sub">Nutrient, Foxit, WASM, Box</text>
      </g>
    </g>

    <!-- Bottom Tagline -->
    <text x="0" y="258" class="tagline-text">Client-Side Zero-Upload Rendering &#8226; Multi-Format Conversion &#8226; Self-Hosted Sovereignty</text>
  </g>
</svg>
